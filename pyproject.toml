[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-reply"
version = "0.1.0"
description = "Turn Word (.docx) review comments and tracked changes into a fillable revision response table (修改对照表) — Markdown / CSV / JSON, zero dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hc-ui" }]
keywords = [
    "docx",
    "word",
    "comments",
    "tracked-changes",
    "review",
    "revision",
    "response-table",
    "thesis",
    "peer-review",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/hc-ui/docx-reply"
Repository = "https://github.com/hc-ui/docx-reply"
Issues = "https://github.com/hc-ui/docx-reply/issues"
Changelog = "https://github.com/hc-ui/docx-reply/blob/main/CHANGELOG.md"

[project.scripts]
docx-reply = "docx_reply.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
